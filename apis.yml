aid: narvar
name: Narvar
description: >
  Narvar is a post-purchase commerce platform serving 1,500+ global retail brands with intelligent
  personalization and automation across delivery, returns, and customer engagement. The platform
  provides APIs for order creation and updates, shipment tracking, returns and exchange management,
  and proactive multi-channel customer notifications. Narvar's IRIS AI engine is trained on 74 billion+
  annual interactions to deliver predictive post-purchase intelligence. Integrations span 1,000+ carriers
  and major commerce platforms including Shopify, Salesforce, Magento, and BigCommerce.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
